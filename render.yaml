# Render Blueprint for Tender.
# Deploys two services from this repo:
#   1. tender-api  — Node + Express API (SQLite, re-seeded on every deploy)
#   2. tender-web  — Static React/Vite dashboard
#
# Deploy: push to GitHub, then on Render → New → Blueprint → pick this repo.
# After the first deploy, set VITE_API_BASE on tender-web to the API's URL
# (e.g. https://tender-api.onrender.com) and trigger a redeploy of the web app.

services:
  # ── API ────────────────────────────────────────────────────
  - type: web
    name: tender-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma db push && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TENDER_MODE
        value: mock            # set to "live" to hit the real PayPal sandbox
      - key: WEB_ORIGIN
        value: "*"             # tighten to your tender-web URL once known
      - key: DATABASE_URL
        value: file:./dev.db   # SQLite, resolved next to prisma/schema.prisma
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: none            # set to "groq" and add GROQ_API_KEY for AI haggling
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false

  # ── Dashboard ──────────────────────────────────────────────
  - type: web
    name: tender-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false            # set to https://tender-api.onrender.com after API deploys
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
